# Development: starts bdus-api (PHP/Apache) + bdus-app (Vite hot-reload) together.
# Run from BraDypUS/ — requires bdus-api/ and bdus-app/ subdirectories.
#
# For production (Nginx + Apache, single port 80, no hot-reload), use instead:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build: bdus-api/
    ports:
      - "8080:80"
    environment:
      - BRADYPUS_DEBUG=1
      # Enables the "Create new application" wizard — required for the test suite.
      - BRADYPUS_ALLOW_NEW_APP=1
      # Allow CORS from the Vite dev server:
      # - BRADYPUS_CORS_ORIGIN=http://localhost:5173
    volumes:
      - ./bdus-api:/var/www/html
      - ./bdus-api/projects:/var/www/html/projects
    networks:
      - bradypus-net

  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./bdus-app:/app
    ports:
      - "5173:5173"
    environment:
      # Inside Docker, the PHP service is reachable via its service name, not localhost.
      - API_PROXY_TARGET=http://app:80
    command: sh -c "npm install && npm run dev"
    networks:
      - bradypus-net

networks:
  bradypus-net:
    driver: bridge
    name: bradypus-net
