name: Build and publish Docker images

# One tag drives both images. bump-version.sh creates the tag; this workflow
# builds ghcr.io/lad-sapienza/bdus-api and ghcr.io/lad-sapienza/bdus-app at the
# same version. Image names are unchanged from the pre-monorepo layout, so
# bradypus.yml keeps working as-is.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # required to push to ghcr.io

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/lad-sapienza/bdus-api
            context: ./bdus-api
          - name: app
            image: ghcr.io/lad-sapienza/bdus-app
            context: ./bdus-app

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Extract version tags from the git tag (e.g. v5.4.4 -> 5.4.4, 5.4, 5)
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # QEMU + Buildx enable multi-platform builds (amd64 + arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
