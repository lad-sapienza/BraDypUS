# Development: starts bdus-api (PHP/Apache) + bdus-app (Vite hot-reload) together.
# Run from BraDypUS/ — requires bdus-api/ and bdus-app/ subdirectories.
#
# For production (Nginx + Apache, single port 80, no hot-reload), use instead:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build: bdus-api/
    ports:
      - "8080:80"
    environment:
      - BRADYPUS_DEBUG=1
      # Enables the "Create new application" wizard — required for the test suite.
      - BRADYPUS_ALLOW_NEW_APP=1
      # Allow CORS from the Vite dev server:
      # - BRADYPUS_CORS_ORIGIN=http://localhost:5173
      # Password reset / self-registration emails (Resend, https://resend.com).
      # Unset by default — those features report themselves as unavailable
      # instead of failing silently when RESEND_API_KEY/MAIL_FROM_ADDRESS are empty.
      # - RESEND_API_KEY=
      # - MAIL_FROM_ADDRESS=
      # - MAIL_FROM_NAME=BraDypUS
    volumes:
      - ./bdus-api:/var/www/html
      - ./bdus-api/projects:/var/www/html/projects
    networks:
      - bradypus-net

  node:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./bdus-app:/app
      # Keep node_modules on a container-native volume rather than the host
      # bind mount: npm install writes thousands of small files and is painfully
      # slow over the Docker Desktop (macOS) mount, and this also avoids mixing
      # host (darwin) and container (linux/musl) native binaries. Reset it with
      # `docker compose down -v`.
      - bdus-app-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      # Inside Docker, the PHP service is reachable via its service name, not localhost.
      - API_PROXY_TARGET=http://app:80
    command: sh -c "npm install && npm run dev"
    networks:
      - bradypus-net

volumes:
  bdus-app-node-modules:

networks:
  bradypus-net:
    driver: bridge
    name: bradypus-net
