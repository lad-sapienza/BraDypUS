name: Build and deploy docs

on:
  push:
    branches: [v5]
  workflow_dispatch:
  schedule:
    # Nightly fetch of bdus-api assets (04:00 UTC)
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Fetch live assets from bdus-api ─────────────────────────────────────
      # oauth.md and widget-api.md now live in bdus-docs directly (no longer fetched)
      - name: Fetch assets from bdus-api
        run: |
          BASE=https://raw.githubusercontent.com/lad-sapienza/bdus-api/main
          curl -fsSL "$BASE/CHANGELOG.md"   -o guide/changelog.md
          curl -fsSL "$BASE/openapi.yaml"   -o public/openapi.yaml

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # ── Deploy ───────────────────────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
