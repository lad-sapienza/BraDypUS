; BraDypUS image defaults — loaded from conf.d after the stock php.ini.
;
; The php:8.4-apache base ships PHP's own defaults (upload_max_filesize 2M,
; post_max_size 8M), far below what a normal photo or orthophoto needs. These
; values are the shipped floor; override by bind-mounting your own file over
; /usr/local/etc/php/conf.d/zz-bradypus.ini and, on any front proxy, raising
; client_max_body_size to match post_max_size.

upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 256M
max_file_uploads = 40
