# bradypus.yml — Deploy BraDypUS using pre-built images from GitHub Container Registry.
# Does NOT require the source code — suitable for end-user deployments.
#
# Usage:
#   curl -O https://raw.githubusercontent.com/lad-sapienza/BraDypUS/v5/bradypus.yml
#   docker compose -f bradypus.yml pull
#   docker compose -f bradypus.yml up -d
#
# Pin to a specific version by setting BDUS_VERSION (default: latest):
#   BDUS_VERSION=5.0.3 docker compose -f bradypus.yml up -d
#
# Change the host port (default: 80):
#   BDUS_PORT=8090 docker compose -f bradypus.yml up -d
#
# Bind to localhost only (useful behind a reverse proxy):
#   BDUS_PORT=127.0.0.1:8090 docker compose -f bradypus.yml up -d
#
# Persistent data (uploaded files, SQLite databases, backups) is stored in
# the named volume "projects_data" and survives restarts and upgrades.
#
# Environment variables you may want to override (via .env or -e):
#   BRADYPUS_DEBUG        — set to 1 to enable debug output (default: 0)
#   BRADYPUS_ALLOW_NEW_APP — set to 1 to enable the new-app wizard (default: 0)
#   RESEND_API_KEY, MAIL_FROM_ADDRESS, MAIL_FROM_NAME — password reset / self-
#     registration emails via Resend (https://resend.com). Unset by default:
#     those features report themselves as unavailable instead of failing
#     silently. One key covers every app on this instance.

services:

  # ── PHP / Apache backend ──────────────────────────────────────────────────
  api:
    image: ghcr.io/lad-sapienza/bdus-api:${BDUS_VERSION:-latest}
    expose:
      - "80"          # only reachable within the Docker network; not published
    environment:
      - BRADYPUS_DEBUG=${BRADYPUS_DEBUG:-0}
      - BRADYPUS_ALLOW_NEW_APP=${BRADYPUS_ALLOW_NEW_APP:-0}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-BraDypUS}
    volumes:
      - projects_data:/var/www/html/projects
    networks:
      - bradypus-net
    restart: unless-stopped

  # ── Vue SPA / Nginx frontend ──────────────────────────────────────────────
  frontend:
    image: ghcr.io/lad-sapienza/bdus-app:${BDUS_VERSION:-latest}
    ports:
      - "${BDUS_PORT:-80}:80"
    environment:
      - API_PROXY_TARGET=http://api:80
    depends_on:
      - api
    networks:
      - bradypus-net
    restart: unless-stopped

volumes:
  projects_data:

networks:
  # Deliberately no `name:` — the network is project-scoped so several
  # instances of this file (in different directories / with different
  # COMPOSE_PROJECT_NAME) get isolated networks instead of sharing one.
  bradypus-net:
    driver: bridge
